<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buat Kamu 🤍</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<audio id="music" loop>
  <source src="lagu.mp3" type="audio/mpeg">
</audio>

<!-- Envelope Overlay -->
<div class="envelope-overlay" id="envelopeOverlay">
  <div class="envelope" onclick="openEnvelope()">
    <div class="flap"></div>
    <div class="heart-seal">💌</div>
  </div>
  <p class="click-hint">Klik amplopnya 🤍</p>
</div>

<div class="card" id="mainCard" style="display:none;">

  <div class="slide active">
  <div class="avatar-wrap">
    <img src="halo.gif" class="avatar">
  </div>

  <h2 class="type" data-text="Hai Kamu 🤍"></h2>
  <p class="type" data-text="Aku cuma mau bilang sesuatu..."></p>
  <button onclick="next()">Lanjut 💫</button>
</div>


  <div class="slide">
    <div class="avatar-wrap">
      <img src="bingung.gif" class="avatar">
    </div>
    <p class="type" data-text="Entah kenapa tiap ngobrol sama kamu"></p>
<p class="type" data-text="rasanya selalu nyamannn bangettttt 🌙"></p>

    <button onclick="next()">Lanjut 💌</button>
  </div>

  <div class="slide">
    <div class="avatar-wrap">
      <img src="mohon.gif" class="avatar">
    </div>
    <p class="type" data-text="Aku serius mau nanya nih sama kamuu…"></p>
<p class="type" data-text="Aku suka sama kamuuu 🤍"></p>

    <button onclick="next()">Lanjut 💖</button>
  </div>

  <div class="slide">
    <div class="avatar-wrap">
      <img src="senyum.gif" class="avatar float">
    </div>
  <p class="type" data-text="Emmmm… Kamu"></p>
  <p class="type" data-text="Mau gak jadi pacarkuuu ? 🤍"></p>

  <div class="choice">
    <button class="yes" id="yesBtn" onclick="jawab()">Mau 💖</button>
    <button class="no" id="noBtn" onclick="next()">Ga mau 🙈</button>
  </div>
</div>

  <div class="slide">
    <div class="avatar-wrap">
      <img src="mohon.gif" class="avatar">
    </div>
    <p class="type" data-text="Baiklah..."></p>
    <p class="type" data-text="Bolehkah aku memperjuangkan mu? 🤍"></p>

    <div class="choice">
      <button class="yes" onclick="perjuangkanPopup()">Boleh 💖</button>
      <button class="no" id="temanNoBtn" onclick="kaburTeman()">kita temenan aja 🙈</button>
    </div>
  </div>

</div>
<div class="popup" id="popup">
  <div class="popup-box">
    <div class="avatar-wrap">
      <img src="terlope2.gif" class="avatar">
    </div>
    <h3>🤍 Yayyy!</h3>
    <p>Terima kasih sudah menjadi pacarku<br>Semoga harimu bahagia selalu bersamaku 🌸</p>
    <button onclick="closePopup()">Oke 💖</button>
  </div>
</div>

<div class="popup" id="perjuangkanPopup">
  <div class="popup-box">
    <div class="avatar-wrap">
      <img src="ciumin.gif" class="avatar">
    </div>
    <h3>🤍 Makasih ya</h3>
    <p>Terima kasih sudah memberi kesempatan<br>untuk memperjuangkanmu 🌸<br>Aku yakin suatu hari nanti<br>akan mendapatkanmu 🤍</p>
    <button onclick="closePerjuangkanPopup()">Oke 💖</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
